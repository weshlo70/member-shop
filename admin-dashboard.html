<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>管理員首頁｜會員商城</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft JhengHei",
        sans-serif;

      background: #f5f7fb;

      color: #222;
    }


    .container {
      width: min(1100px, 94%);

      margin: 0 auto;

      padding:
        25px 0 50px;
    }


    /* ========================================
       頁首
    ======================================== */

    .header {
      display: flex;

      justify-content:
        space-between;

      align-items: center;

      gap: 15px;

      margin-bottom: 25px;
    }


    .header h1 {
      margin: 0;

      font-size: 28px;
    }


    .header-sub {
      margin-top: 6px;

      color: #777;

      font-size: 14px;
    }


    .user-box {
      background: white;

      border-radius: 14px;

      padding: 12px 16px;

      box-shadow:
        0 3px 15px rgba(0, 0, 0, .06);
    }


    .user-name {
      font-weight: 700;
    }


    .user-role {
      font-size: 13px;

      color: #777;

      margin-top: 3px;
    }


    .logout-btn {
      margin-top: 8px;

      border: 0;

      background: #eee;

      border-radius: 8px;

      padding: 7px 12px;

      cursor: pointer;
    }


    /* ========================================
       統計卡片
    ======================================== */

    .stats {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 16px;

      margin-bottom: 25px;
    }


    .stat-card {
      background: white;

      border-radius: 16px;

      padding: 22px;

      box-shadow:
        0 3px 15px rgba(0, 0, 0, .06);
    }


    .stat-title {
      color: #777;

      font-size: 14px;
    }


    .stat-value {
      font-size: 30px;

      font-weight: 800;

      margin-top: 8px;
    }


    /* ========================================
       儲值申請
    ======================================== */

    .section {
      background: white;

      border-radius: 16px;

      padding: 22px;

      box-shadow:
        0 3px 15px rgba(0, 0, 0, .06);
    }


    .section-header {
      display: flex;

      justify-content:
        space-between;

      align-items: center;

      margin-bottom: 18px;
    }


    .section-title {
      font-size: 21px;

      font-weight: 700;
    }


    .refresh-btn {
      border: 0;

      border-radius: 9px;

      padding: 9px 15px;

      cursor: pointer;

      background: #eee;
    }


    .request-list {
      display: flex;

      flex-direction: column;

      gap: 14px;
    }


    .request-card {
      border: 1px solid #e5e7eb;

      border-radius: 13px;

      padding: 18px;
    }


    .request-top {
      display: flex;

      justify-content:
        space-between;

      gap: 15px;
    }


    .request-id {
      font-size: 14px;

      font-weight: 700;
    }


    .request-amount {
      font-size: 22px;

      font-weight: 800;
    }


    .request-info {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 8px 20px;

      margin-top: 15px;

      color: #555;

      font-size: 14px;
    }


    .request-note {
      margin-top: 12px;

      padding: 10px;

      background: #f7f7f7;

      border-radius: 8px;

      font-size: 14px;
    }


    .request-actions {
      display: flex;

      gap: 10px;

      margin-top: 15px;
    }


    .approve-btn,
    .reject-btn {
      border: 0;

      border-radius: 9px;

      padding: 10px 18px;

      cursor: pointer;

      font-weight: 700;
    }


    .approve-btn {
      background: #e8f7ed;
    }


    .reject-btn {
      background: #fdeaea;
    }


    /* ========================================
       狀態
    ======================================== */

    .status {
      display: inline-block;

      padding:
        5px 10px;

      border-radius: 999px;

      font-size: 12px;

      font-weight: 700;
    }


    .status-pending {
      background: #fff3cd;
    }


    .status-approved {
      background: #e7f6ec;
    }


    .status-rejected {
      background: #fce8e8;
    }


    .empty {
      text-align: center;

      padding: 45px 10px;

      color: #888;
    }


    .loading {
      text-align: center;

      padding: 40px;

      color: #888;
    }


    /* ========================================
       自訂確認視窗
    ======================================== */

    .modal-backdrop {
      position: fixed;

      inset: 0;

      display: none;

      align-items: center;

      justify-content: center;

      background:
        rgba(0, 0, 0, .45);

      z-index: 9999;

      padding: 20px;
    }


    .modal {
      width:
        min(420px, 100%);

      background: white;

      border-radius: 18px;

      padding: 25px;

      box-shadow:
        0 15px 45px rgba(0, 0, 0, .2);
    }


    .modal-title {
      font-size: 20px;

      font-weight: 800;
    }


    .modal-text {
      margin-top: 12px;

      color: #555;

      line-height: 1.6;
    }


    .modal-buttons {
      display: flex;

      gap: 10px;

      justify-content:
        flex-end;

      margin-top: 22px;
    }


    .modal-btn {
      border: 0;

      border-radius: 9px;

      padding: 10px 18px;

      cursor: pointer;
    }


    .modal-cancel {
      background: #eee;
    }


    .modal-ok {
      background: #222;

      color: white;
    }


    /* ========================================
       操作訊息
    ======================================== */

    .message {
      display: none;

      margin-bottom: 15px;

      padding: 12px 15px;

      border-radius: 9px;

      font-size: 14px;
    }


    .message-success {
      background: #e8f7ed;

      color: #26733d;
    }


    .message-error {
      background: #fdeaea;

      color: #a33;
    }


    /* ========================================
       手機
    ======================================== */

    @media (max-width: 650px) {

      .header {
        flex-direction: column;

        align-items: stretch;
      }


      .stats {
        grid-template-columns: 1fr;
      }


      .request-info {
        grid-template-columns: 1fr;
      }


      .request-top {
        flex-direction: column;
      }


      .request-actions {
        flex-direction: column;
      }


      .approve-btn,
      .reject-btn {
        width: 100%;
      }

    }

  </style>

</head>


<body>


<div class="container">


  <!-- ========================================
       頁首
  ======================================== -->

  <div class="header">

    <div>

      <h1>
        管理員首頁
      </h1>

      <div class="header-sub">
        會員商城管理系統
      </div>

    </div>


    <div class="user-box">

      <div
        class="user-name"
        id="adminName"
      >
        載入中...
      </div>


      <div
        class="user-role"
        id="adminRole"
      >
      </div>


      <button
        class="logout-btn"
        id="logoutBtn"
      >
        登出
      </button>

    </div>

  </div>


  <!-- ========================================
       統計
  ======================================== -->

  <div class="stats">

    <div class="stat-card">

      <div class="stat-title">
        待審核儲值筆數
      </div>


      <div
        class="stat-value"
        id="pendingCount"
      >
        0
      </div>

    </div>


    <div class="stat-card">

      <div class="stat-title">
        待審核儲值總額
      </div>


      <div
        class="stat-value"
        id="pendingAmount"
      >
        $0
      </div>

    </div>

  </div>


  <!-- ========================================
       儲值申請
  ======================================== -->

  <div class="section">

    <div class="section-header">

      <div class="section-title">
        儲值申請
      </div>


      <button
        class="refresh-btn"
        id="refreshBtn"
      >
        🔄 重新整理
      </button>

    </div>


    <div
      id="message"
      class="message"
    >
    </div>


    <div
      id="requestList"
      class="request-list"
    >

      <div class="loading">
        載入中...
      </div>

    </div>

  </div>


</div>


<!-- ========================================
     自訂確認視窗
======================================== -->

<div
  class="modal-backdrop"
  id="confirmModal"
>

  <div class="modal">

    <div
      class="modal-title"
      id="confirmTitle"
    >
      確認操作
    </div>


    <div
      class="modal-text"
      id="confirmText"
    >
    </div>


    <div class="modal-buttons">

      <button
        class="modal-btn modal-cancel"
        id="confirmCancel"
      >
        取消
      </button>


      <button
        class="modal-btn modal-ok"
        id="confirmOk"
      >
        確定
      </button>

    </div>

  </div>

</div>


<script src="admin-dashboard.js"></script>


</body>

</html>
