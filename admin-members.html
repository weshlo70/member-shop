<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>會員資料查詢｜貴賓商城</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#222;font:16px/1.6 system-ui,"Microsoft JhengHei",sans-serif}main{max-width:1100px;margin:25px auto;padding:0 18px}nav,form{display:flex;gap:12px;flex-wrap:wrap;align-items:center}a,button{background:#2458a6;color:white;border:0;border-radius:8px;padding:10px 16px;text-decoration:none;font:inherit;cursor:pointer}button:disabled{opacity:.5}section{background:white;border-radius:14px;padding:20px;margin-top:20px}input,select{font:inherit;padding:10px;border:1px solid #bac5d4;border-radius:8px}input{flex:1;min-width:180px}table{border-collapse:collapse;width:100%;white-space:nowrap}td,th{text-align:left;padding:12px;border-bottom:1px solid #e3e8ef}.scroll{overflow:auto}dt{font-weight:bold}dd{margin:0 0 12px;overflow-wrap:anywhere}#message{color:#43536a}h1{font-size:28px}</style></head><body><main><h1>會員資料查詢</h1><nav><a href="admin-dashboard.html">儲值申請審核</a><button id="logout">登出</button></nav><section><form id="search"><label for="field">查詢方式</label><select id="field"><option value="MemberID">會員編號（完整）</option><option value="Name">會員姓名（模糊）</option><option value="Phone">手機號碼（完整）</option></select><input id="query" required minlength="2" maxlength="80" placeholder="請輸入查詢條件" aria-label="查詢條件"><button id="submit">查詢</button></form><p id="message" role="status">請輸入條件，最多顯示 20 筆。</p><div class="scroll"><table><thead><tr><th>會員編號</th><th>姓名</th><th>電話</th><th>餘額</th><th>狀態</th><th>操作</th></tr></thead><tbody id="results"></tbody></table></div></section><section id="detail" hidden><h2>會員詳細資料</h2><button id="close">關閉詳情</button><dl id="fields"></dl></section></main><script src="admin-members.js" defer></script></body></html>
