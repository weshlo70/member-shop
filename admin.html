<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>管理員登入｜會員商城</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <div class="container">

    <div class="page-header">

      <h1>管理員登入</h1>

      <p>
        會員商城管理系統
      </p>

    </div>


    <div class="card">

      <form id="adminLoginForm">

        <div class="form-group">

          <label>
            管理員帳號
          </label>

          <input
            type="text"
            id="username"
            autocomplete="username"
            placeholder="請輸入管理員帳號"
            required
          >

        </div>


        <div class="form-group">

          <label>
            管理員密碼
          </label>

          <input
            type="password"
            id="password"
            autocomplete="current-password"
            placeholder="請輸入管理員密碼"
            required
          >

        </div>


        <button
          type="submit"
          id="loginBtn"
          class="primary-btn"
        >
          登入
        </button>


        <div
          id="loginMessage"
          class="form-message"
        ></div>

      </form>

    </div>

  </div>


  <script src="admin.js"></script>

</body>

</html>
