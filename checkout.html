<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>確認訂單</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<div class="app">


    <header class="header">

        <button
            class="back-button"
            onclick="history.back()"
        >
            ←
        </button>

        <div class="header-title">
            確認訂單
        </div>

        <div></div>

    </header>


    <main class="container">


        <div class="shop-main-title">
            確認訂單
        </div>


        <div
            id="checkoutItems"
            class="checkout-card"
        >
        </div>


        <div class="checkout-card">

            <div class="card-title">
                帳戶資訊
            </div>


            <div class="info-row">

                <span>
                    目前餘額
                </span>

                <strong
                    id="currentBalance"
                >
                    $0
                </strong>

            </div>


            <div class="info-row">

                <span>
                    訂單金額
                </span>

                <strong
                    id="orderTotal"
                >
                    $0
                </strong>

            </div>


            <div class="info-row">

                <span>
                    付款後餘額
                </span>

                <strong
                    id="balanceAfter"
                >
                    $0
                </strong>

            </div>

        </div>


        <div class="checkout-card delivery-card">
            <div class="card-title">收件與發票資訊</div>
            <label for="recipientName">收件人姓名 <span class="required-mark">*</span></label>
            <input id="recipientName" type="text" maxlength="60" autocomplete="name" required placeholder="請輸入收件人姓名">
            <label for="recipientPhone">聯絡電話 <span class="required-mark">*</span></label>
            <input id="recipientPhone" type="tel" maxlength="30" autocomplete="tel" required placeholder="手機或市話">
            <label for="shippingAddress">收件地址 <span class="required-mark">*</span></label>
            <textarea id="shippingAddress" rows="2" maxlength="250" autocomplete="street-address" required placeholder="郵遞區號、縣市、區鄉鎮、路段及門牌"></textarea>
            <label class="delivery-check"><input id="invoiceSameAsShipping" type="checkbox" checked> 發票寄送地址同收件地址</label>
            <div id="invoiceAddressWrap" hidden>
                <label for="invoiceAddress">發票寄送地址 <span class="required-mark">*</span></label>
                <textarea id="invoiceAddress" rows="2" maxlength="250" placeholder="請輸入發票寄送地址"></textarea>
            </div>
        </div>

        <div
            id="checkoutMessage"
            class="checkout-message"
        >
        </div>


        <button
            id="confirmOrderButton"
            class="primary-button"
        >
            確認付款並下單
        </button>


    </main>


    <div
        id="loading"
        class="loading hidden"
    >

        <div class="loading-box">

            <div class="spinner"></div>

            <div>
                處理中...
            </div>

        </div>

    </div>


</div>


<script src="checkout.js"></script>


</body>

</html>
