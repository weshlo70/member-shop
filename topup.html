<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>儲值紀錄</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>
        .payment-method-options {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .payment-method-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 14px 16px;
            border: 1px solid #ddd;
            border-radius: 12px;
            cursor: pointer;
            background: #fff;
        }

        .payment-method-option input {
            width: auto;
            margin: 0;
        }

        .payment-method-help {
            margin-top: 12px;
            color: #666;
            line-height: 1.7;
            font-size: 14px;
        }

        .payment-method-section.hidden {
            display: none;
        }

        @media (max-width: 600px) {
            .payment-method-options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- Header -->
    <header class="header">

        <button
            class="back-button"
            onclick="window.location.href='index.html'"
        >
            ←
        </button>

        <div class="header-title">
            儲值紀錄
        </div>

        <div></div>

    </header>


    <main class="container">

        <!-- 目前餘額 -->
        <div class="balance-card">

            <div class="balance-title">
                目前儲值餘額
            </div>

            <div
                id="memberBalance"
                class="balance"
            >
                $0
            </div>

        </div>


        <!-- 儲值說明 -->
        <div class="info-card">

            <div class="card-title">
                儲值方式
            </div>

            <div class="topup-description">

                <p>
                    可選擇「銀行匯款」或「傳真刷卡」提出儲值申請。
                </p>

                <p>
                    我們確認款項或刷卡資料完成後，才會將金額加入您的會員餘額。
                </p>

                <div class="topup-notice">
                    ⚠️ 送出申請後，餘額不會立即增加。
                </div>

            </div>

        </div>


        <!-- 儲值申請 -->
        <div class="info-card">

            <div class="card-title">
                我要申請儲值
            </div>


            <!-- 金額 -->
            <div class="form-group">

                <label for="amount">
                    儲值金額
                </label>

                <input
                    id="amount"
                    type="number"
                    min="1"
                    step="1"
                    placeholder="請輸入儲值金額"
                >

            </div>


            <!-- 儲值方式 -->
            <div class="form-group">

                <label>
                    儲值方式
                </label>

                <div class="payment-method-options">

                    <label class="payment-method-option">
                        <input
                            type="radio"
                            name="paymentMethod"
                            value="BankTransfer"
                            checked
                        >
                        <span>銀行匯款</span>
                    </label>

                    <label class="payment-method-option">
                        <input
                            type="radio"
                            name="paymentMethod"
                            value="FaxCard"
                        >
                        <span>傳真刷卡</span>
                    </label>

                </div>

                <div
                    id="paymentMethodHelp"
                    class="payment-method-help"
                >
                    請先完成匯款，再填寫下方匯款資料。
                </div>

            </div>


            <!-- 銀行匯款欄位 -->
            <div
                id="bankTransferFields"
                class="payment-method-section"
            >

                <div class="form-group">

                    <label for="transferDate">
                        匯款日期
                    </label>

                    <input
                        id="transferDate"
                        type="date"
                    >

                </div>


                <div class="form-group">

                    <label for="transferTime">
                        匯款時間
                    </label>

                    <input
                        id="transferTime"
                        type="time"
                    >

                </div>


                <div class="form-group">

                    <label for="bank">
                        匯款銀行
                    </label>

                    <input
                        id="bank"
                        type="text"
                        placeholder="例如：台新銀行"
                    >

                </div>


                <div class="form-group">

                    <label for="accountLast5">
                        匯款帳號後五碼
                    </label>

                    <input
                        id="accountLast5"
                        type="text"
                        maxlength="5"
                        inputmode="numeric"
                        placeholder="請輸入5位數字"
                    >

                </div>

            </div>


            <!-- 傳真刷卡欄位 -->
            <div
                id="faxCardFields"
                class="payment-method-section hidden"
            >

                <div class="form-group">

                    <label for="faxDate">
                        傳真日期
                    </label>

                    <input
                        id="faxDate"
                        type="date"
                    >

                </div>


                <div class="form-group">

                    <label for="faxTime">
                        傳真時間
                    </label>

                    <input
                        id="faxTime"
                        type="time"
                    >

                </div>


                <div class="form-group">

                    <label for="cardLast4">
                        信用卡末四碼
                    </label>

                    <input
                        id="cardLast4"
                        type="text"
                        maxlength="4"
                        inputmode="numeric"
                        autocomplete="off"
                        placeholder="請輸入4位數字"
                    >

                </div>

                <div class="topup-notice">
                    🔒 網頁只記錄信用卡末四碼。完整卡號、有效期限及安全碼請勿輸入本系統。
                </div>

            </div>


            <!-- 備註 -->
            <div class="form-group">

                <label for="note">
                    備註（選填）
                </label>

                <input
                    id="note"
                    type="text"
                    placeholder="其他需要告知的資訊"
                >

            </div>


            <button
                id="submitTopupButton"
                class="primary-button"
            >
                送出儲值申請
            </button>


            <div
                id="topupMessage"
                class="message"
            ></div>

        </div>


        <!-- 儲值紀錄 -->
        <div class="info-card">

            <div class="card-title">
                我的儲值申請
            </div>

            <div
                id="topupList"
                class="topup-list"
            >

                <div class="topup-loading">
                    載入中...
                </div>

            </div>

        </div>

    </main>


    <!-- Loading -->
    <div
        id="loading"
        class="loading hidden"
    >

        <div class="loading-box">

            <div class="spinner"></div>

            <div>
                處理中...
            </div>

        </div>

    </div>

</div>


<script src="topup.js"></script>

</body>

</html>
